[workspace]
members = ["init", "generator"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "OSL-3.0"
authors = ["Dae Euhwa"]
repository = "https://github.com/Veridian-Zenith/Galdr"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
