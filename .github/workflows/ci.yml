name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege. Building and testing only needs to read the repo.
# Artifact upload authenticates via ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN
# scopes, so it needs nothing extra here. Without this block the job inherits
# the repo default (full contents/packages/actions write), which it never uses.
permissions:
  contents: read

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Build
        run: env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS cargo build --release --workspace

      - name: Test
        run: env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS cargo test --workspace

      # The generator only produces a real image as root with /lib/modules and
      # /lib/firmware present, which CI does not have -- so exercise the CLI
      # surface that must work anywhere: flag parsing and hook listing.
      - name: CLI smoke test
        run: |
          set -euo pipefail
          ./target/release/galdr --list-hooks
          ./target/release/galdr --version
          ./target/release/galdr --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galdr-linux-x86_64
          path: |
            target/release/galdr
            target/release/galdr-init
