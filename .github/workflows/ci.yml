name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS cargo clippy --release --workspace -- -D warnings

      - name: Build
        run: env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS cargo build --release --workspace

      - name: Test dry-run
        run: ./target/release/galdr --dry-run --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galdr-linux-x86_64
          path: |
            target/release/galdr
            target/release/galdr-init
