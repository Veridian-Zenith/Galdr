[package]
name = "galdr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Galdr initramfs generator"

[lib]
name = "galdr"
path = "src/lib.rs"

[[bin]]
name = "galdr"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
zstd = "0.14"
flate2 = "1"
xz2 = "0.1"
