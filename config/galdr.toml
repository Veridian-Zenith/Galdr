# Galdr - Initramfs Configuration
# https://github.com/Veridian-Zenith/Galdr

# Kernel version to build for ("auto" = running kernel)
kernel = "auto"

# Compression: zstd, gzip, xz, lz4, none
# zstd/gzip/xz use native Rust crates. lz4 requires the `lz4` binary on PATH.
compress = "zstd"

# Root device detection: "auto" or explicit device (e.g., "/dev/nvme0n1p2")
root = "auto"

# Seconds to wait for root device before fallback
timeout = 10

# What to do when boot fails: "shell" or "reboot"
fallback = "shell"

# Hooks to run, in order. "base" is always forced to the front.
hooks = ["base", "autodetect", "block", "filesystems", "modconf"]

# Extra kernel modules to include (empty = auto-detect from running system).
# Append "?" to make a module optional, e.g. "ahci?".
# modules = ["ext4", "nvme", "usbcore"]

# Extra binaries to include, with their shared library deps resolved via ldd
# binaries = ["/usr/bin/strace"]

# Extra firmware files
# firmware = ["/lib/firmware/amdgpu/ucode.bin"]

# Extra files to pack into the initramfs
# files = ["/etc/crypttab"]